name: Build APK from decompiled source

# 在干净的 x86_64 runner 上原生构建（aapt2 可直接运行，无需交叉编译或模拟）
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APKTOOL_VERSION: "2.11.1"
  OUT_APK: build/deepseek-chat-2.6.1-unsigned.apk
  SIGNED_APK: build/deepseek-chat-2.6.1-signed.apk

jobs:
  build:
    name: apktool b + zipalign + apksigner + verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Cache apktool jar
        id: apktool-cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: apktool-${{ env.APKTOOL_VERSION }}

      - name: Download apktool
        if: steps.apktool-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar --version

      - name: Create signing keystore
        run: bash scripts/make-keystore.sh

      - name: Build (apktool b)
        run: bash scripts/build.sh

      - name: Sign (zipalign + apksigner)
        run: bash scripts/sign.sh "$OUT_APK" "$SIGNED_APK"

      # 严格判定：任何语义漂移都会让整个 workflow 变红
      - name: Verify equivalence vs original APK
        run: bash scripts/verify.sh

      - name: Build summary
        if: always()
        run: |
          {
            echo "## DeepSeek Chat v2.6.1 — 源码重建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            if [ -f "$SIGNED_APK" ]; then
              echo "| 重建 APK | \`$(stat -c %s "$SIGNED_APK")\` 字节 |"
              echo "| 重建 APK MD5 | \`$(md5sum "$SIGNED_APK" | cut -d' ' -f1)\` |"
            else
              echo "| 重建 APK | 未生成 |"
            fi
            echo "| 原始 APK | \`$(stat -c %s original/deepseek-chat-v2.6.1-base.apk 2>/dev/null || echo n/a)\` 字节 |"
            echo ""
            echo "### 验证结论"
            echo '```'
            cat verify/VERIFY-SUMMARY.txt 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK + verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-chat-2.6.1-rebuilt
          path: |
            build/*.apk
            verify/*.txt
          if-no-files-found: warn
          retention-days: 30

  reproduce:
    name: 独立复现（重新下载源码 + 产物再验一遍）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Download apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: deepseek-chat-2.6.1-rebuilt
          path: .

      - name: Show what we got
        run: find build verify -type f -printf '%s\t%p\n' 2>/dev/null || true

      - name: Verify equivalence again (independent run)
        run: bash scripts/verify.sh
