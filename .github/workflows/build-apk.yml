name: Build APK from decompiled source

# 在干净的 x86_64 runner 上原生构建（aapt2 可直接运行，无需交叉/模拟）
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APKTOOL_VERSION: "2.11.1"
  OUT_APK: build/deepseek-chat-2.6.1-unsigned.apk
  SIGNED_APK: build/deepseek-chat-2.6.1-signed.apk

jobs:
  build:
    name: apktool b + zipalign + apksigner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Cache apktool jar
        id: apktool-cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: apktool-${{ env.APKTOOL_VERSION }}

      - name: Download apktool
        if: steps.apktool-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar --version

      - name: Show apktool version
        if: steps.apktool-cache.outputs.cache-hit == 'true'
        run: java -jar apktool.jar --version

      - name: Create signing keystore
        run: bash scripts/make-keystore.sh

      - name: Build (apktool b)
        run: bash scripts/build.sh

      - name: Sign (zipalign + apksigner)
        run: bash scripts/sign.sh "$OUT_APK" "$SIGNED_APK"

      - name: Verify against original APK
        id: verify
        continue-on-error: true
        run: bash scripts/verify.sh 2>&1 | tee verify/VERIFY-LOG.txt

      - name: Build summary
        if: always()
        run: |
          {
            echo "## DeepSeek Chat v2.6.1 — 源码重建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            if [ -f "$SIGNED_APK" ]; then
              echo "| 重建 APK | \`$(stat -c %s "$SIGNED_APK")\` 字节 |"
              echo "| 重建 APK MD5 | \`$(md5sum "$SIGNED_APK" | cut -d' ' -f1)\` |"
            else
              echo "| 重建 APK | ❌ 未生成 |"
            fi
            echo "| 原始 APK | \`$(stat -c %s original/deepseek-chat-v2.6.1-base.apk 2>/dev/null || echo n/a)\` 字节 |"
            echo "| 差分验证 | ${{ steps.verify.outcome == 'success' && '✅ 通过' || '⚠️ 见 VERIFY-LOG.txt' }} |"
            echo ""
            echo "### 重建 APK 指纹"
            echo '```'
            if [ -f "$SIGNED_APK" ]; then
              $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$SIGNED_APK" 2>/dev/null | head -5
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK + verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-chat-2.6.1-rebuilt
          path: |
            build/*.apk
            verify/*.txt
          if-no-files-found: warn
          retention-days: 30

  verify-only:
    name: 差分验证（独立作业）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"
      - name: Download apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
      - name: Download rebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: deepseek-chat-2.6.1-rebuilt
          path: build/
      - name: Verify dex round-trip
        run: bash scripts/verify.sh
